<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-A-Muna | Reviews</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10000; align-items:center; justify-content:center; }
        .modal.show { display:flex; }
        .modal-content { background:#fff; width:min(560px, 92vw); border-radius:12px; padding:1.2rem 1.4rem; max-height:85vh; overflow:auto; }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
        .close-btn { border:none; background:none; font-size:1.8rem; cursor:pointer; }
        .form-group { margin-bottom:0.8rem; }
        .form-group label { display:block; margin-bottom:0.35rem; color:var(--primary-green); font-weight:600; letter-spacing:1px; font-size:0.8rem; }
        .form-group input, .form-group textarea, .form-group select { width:100%; padding:.65rem .7rem; border:2px solid var(--light-gray); border-radius:8px; font-family:var(--font-mono); }
        .form-group textarea { min-height:100px; resize:vertical; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo-white.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
            </div>
            <div class="header-actions">
                <button class="header-btn" data-href="map.html">MAP</button>
                <button class="header-btn">FAVS</button>
                <button class="header-btn signup" data-href="signup-user.html">SIGNUP</button>
            </div>
        </div>
    </header>

    <nav class="nav">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="discover.html" class="nav-link">DISCOVER</a>
        <a href="reviewtab.html" class="nav-link active">REVIEWS</a>
        <a href="community.html" class="nav-link">COMMUNITY</a>
    </nav>
    <main class="reviews-page">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
            <h2 class="section-title">REVIEWS</h2>
            <div style="display:flex;gap:0.75rem;align-items:center;">
                <label for="review-sort">Sort:</label>
                <select id="review-sort">
                    <option value="recent">Recent</option>
                    <option value="helpful">Most Helpful</option>
                </select>
                <label style="display:flex;align-items:center;gap:0.25rem;margin-left:0.5rem;">
                    <input type="checkbox" id="warranty-watch"> Warranty Watch
                </label>
                <button id="create-review-btn" class="header-btn" style="margin-left:0.5rem;" data-href="make-review.html">Write a Review</button>
            </div>
        </div>

        <h3 id="reviews-subtitle" style="margin-top:1rem;color:#666;font-family:var(--font-mono);">Showing all reviews</h3>

        <div class="reviews-grid" id="reviews-grid-container">
            <!-- Will be populated by JS -->
        </div>
    </main>
    <div id="review-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>WRITE A REVIEW</h2>
                <button class="close-btn" id="close-review-modal">&times;</button>
            </div>
            <form id="review-form">
                <div class="form-group">
                    <label>Store</label>
                    <select id="review-store" required></select>
                </div>
                <div class="form-group">
                    <label>Rating</label>
                    <select id="review-rating" required>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Okay</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Bad</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Headline</label>
                    <input type="text" id="review-headline" required>
                </div>
                <div class="form-group">
                    <label>Your Review</label>
                    <textarea id="review-text" required></textarea>
                </div>
                <button type="submit" class="auth-btn">POST REVIEW</button>
            </form>
        </div>
    </div>

    <!-- Review creation moved to make-review.html; modal removed -->
    <footer class="custom-footer">
        <div class="footer-container">

            <div class="footer-left">
            <div class="footer-logo">
                <img src="logo-green.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>

            <a href="contact-page.html" class="footer-btn">CONTACT US</a>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-right">
            <ul>
                <li><a href="about-page.html">ABOUT</a></li>
                <li><a href="privacy-page.html">PRIVACY</a></li>
                <li><a href="terms-page.html">TERMS</a></li>
                <li><a href="social-links.html">SOCIAL LINKS</a></li>
            </ul>
            </div>

        </div>
        <div class="footer-copy">© 2026 Group RAMBUTAN. All rights reserved.</div>
    </footer>
    <script src="js/app.js"></script>
    <script src="js/reviewtab.js"></script>
</body>
</html>
