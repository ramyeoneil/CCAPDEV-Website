<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-A-Muna | Reviews</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo-white.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="window.location.href='map.html'">MAP</button>
                <button class="header-btn">FAVS</button>
                <button class="header-btn signup" onclick="window.location.href='signup-user.html'">SIGNUP</button>
            </div>
        </div>
    </header>

    <nav class="nav">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="discover.html" class="nav-link">DISCOVER</a>
        <a href="reviewtab.html" class="nav-link active">REVIEWS</a>
        <a href="community.html" class="nav-link">COMMUNITY</a>
        <a href="#" class="nav-link">HELP</a>
    </nav>
    <main class="reviews-page">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
            <h2 class="section-title">REVIEWS</h2>
            <div style="display:flex;gap:0.75rem;align-items:center;">
                <label for="review-sort">Sort:</label>
                <select id="review-sort">
                    <option value="recent">Recent</option>
                    <option value="helpful">Most Helpful</option>
                </select>
                <label style="display:flex;align-items:center;gap:0.25rem;margin-left:0.5rem;">
                    <input type="checkbox" id="warranty-watch"> Warranty Watch
                </label>
                <button id="create-review-btn" class="header-btn" style="margin-left:0.5rem;">Write a Review</button>
            </div>
        </div>

        <h3 id="reviews-subtitle" style="margin-top:1rem;color:#666;font-family:var(--font-mono);">Showing all reviews</h3>

        <div class="reviews-grid" id="reviews-grid-container">
            <!-- Will be populated by JS -->
        </div>
    </main>

    <!-- Review Modal -->
    <div id="review-modal" class="center-modal">
        <div class="center-modal-content">
            <h2 id="modal-title">Write a Review</h2>
            <form id="review-form">
                <input type="hidden" id="review-id">
                <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;">
                    <input id="store-name" placeholder="Store name" required style="flex:1;padding:0.6rem;border:1px solid #ddd;border-radius:6px;">
                </div>
                <input id="headline" placeholder="Headline" required style="width:100%;padding:0.6rem;border:1px solid #ddd;border-radius:6px;margin-bottom:0.5rem;">
                <textarea id="review-text" placeholder="Write your detailed review here" rows="5" style="width:100%;padding:0.6rem;border:1px solid #ddd;border-radius:6px;margin-bottom:0.5rem;" required></textarea>

                <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;">
                    <label>Pricing:</label>
                    <select id="score-pricing">
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                    <label>Customer Service:</label>
                    <select id="score-cs">
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                    <label>After-Sales/Warranty:</label>
                    <select id="score-after">
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                </div>

                <div style="margin-bottom:0.5rem;">
                    <label>Upload images (optional):</label>
                    <input type="file" id="review-images-input" accept="image/*" multiple>
                    <div id="image-previews" style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;"></div>
                </div>

                <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.75rem;">
                    <button type="button" class="modal-btn cancel" onclick="closeReviewModal()">Cancel</button>
                    <button type="submit" class="modal-btn confirm">Submit Review</button>
                </div>
            </form>
        </div>
    </div>
    <footer class="custom-footer">
        <div class="footer-container">

            <div class="footer-left">
            <div class="footer-logo">
                <img src="logo-green.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>

            <a href="contact-page.html" class="footer-btn">CONTACT US</a>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-right">
            <ul>
                <li><a href="about-page.html">ABOUT</a></li>
                <li><a href="privacy-page.html">PRIVACY</a></li>
                <li><a href="terms-page.html">TERMS</a></li>
                <li><a href="social-links.html">SOCIAL LINKS</a></li>
            </ul>
            </div>

        </div>
        <div class="footer-copy">© 2026 Group RAMBUTAN. All rights reserved.</div>
    </footer>
    <script src="app.js"></script>
    <script>
        // Update header and UI
        updateHeader();
        makeLogoClickable();

        const reviewsContainer = document.getElementById('reviews-grid-container');
        const sortSelect = document.getElementById('review-sort');
        const warrantyWatch = document.getElementById('warranty-watch');
        const subtitle = document.getElementById('reviews-subtitle');

        function renderReviews() {
            const all = getAllReviews();
            let list = all.slice();

            // Warranty watch filter: show reviews with low afterSales or mentioning warranty
            if (warrantyWatch.checked) {
                list = list.filter(r => (r.builderScores && r.builderScores.afterSales <= 3) || /warranty|after-sales|after sales/i.test(r.text));
                subtitle.textContent = `Showing warranty-related reviews (${list.length})`;
            } else {
                subtitle.textContent = `Showing ${list.length} reviews`;
            }

            // Sorting
            const sort = sortSelect.value;
            if (sort === 'helpful') {
                list.sort((a,b) => (b.upvotes || 0) - (a.upvotes || 0));
            } else {
                list.sort((a,b) => new Date(b.date) - new Date(a.date));
            }

            reviewsContainer.innerHTML = '';

            list.forEach(review => {
                const card = document.createElement('div');
                card.className = 'review-card';

                const current = getCurrentUser();

                const userSection = `
                    <div class="review-header">
                        <div class="review-user">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png?20170328184010" alt="User">
                            <div>
                                <h4>${review.username}</h4>
                                <span>${review.date}</span>
                            </div>
                        </div>
                        <div style="display:flex;gap:0.5rem;align-items:center;">
                            <button class="header-btn" data-upvote="${review.id}">▲ ${review.upvotes || 0}</button>
                            ${current && current.id === review.userId ? `<button class="header-btn edit-btn" data-edit="${review.id}">Edit</button><button class="header-btn delete-btn" data-delete="${review.id}">Delete</button>` : ''}
                        </div>
                    </div>
                `;

                const mediaHTML = (review.media && review.media.length) ? `<div style="margin:0.5rem 0;">${review.media.slice(0,3).map(m=>`<img src="${m}" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-bottom:6px;">`).join('')}</div>` : '';

                const scores = review.builderScores || {};
                const scoresHTML = `<div style="font-family:var(--font-mono);color:#555;margin-top:6px;">Pricing: ${scores.pricing||'-'} · Service: ${scores.customerService||'-'} · After-Sales: ${scores.afterSales||'-'}</div>`;

                card.innerHTML = `
                    ${userSection}
                    <img src="https://via.placeholder.com/600x200/d9d9d9/00703c?text=Store" class="review-image" alt="Store">
                    <div class="review-content">
                        <h3>${review.storeName || 'PC Store'}</h3>
                        <div class="review-stars">${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}</div>
                        <h4 style="margin:6px 0;">${review.headline || ''}</h4>
                        <p>${(review.text || '').slice(0,200)}${(review.text||'').length>200?'...':''}</p>
                        ${scoresHTML}
                        ${mediaHTML}
                    </div>
                `;

                // navigate to detail on click except buttons
                card.addEventListener('click', (ev) => {
                    if (ev.target.matches('button') || ev.target.closest('button')) return;
                    window.location.href = `review-detail.html?id=${review.id}`;
                });

                // upvote handler
                card.querySelectorAll('[data-upvote]').forEach(b => b.addEventListener('click', async (e)=>{
                    e.stopPropagation();
                    if (!requireLogin('upvote reviews')) return;
                    const uid = getCurrentUser().id;
                    upvoteReview(parseInt(b.getAttribute('data-upvote')), uid);
                    renderReviews();
                }));

                // edit/delete handlers
                card.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    openEditModal(parseInt(b.getAttribute('data-edit')));
                }));

                card.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', async (e)=>{
                    e.stopPropagation();
                    const id = parseInt(b.getAttribute('data-delete'));
                    const confirmed = await showConfirmation('Delete this review?', 'Confirm Delete');
                    if (confirmed) {
                        deleteReview(id);
                        showNotification('Review deleted', 'Deleted', 'warning');
                        renderReviews();
                    }
                }));

                reviewsContainer.appendChild(card);
            });
        }

        // Modal helpers
        function openReviewModal() {
            document.getElementById('review-modal').classList.add('show');
        }
        function closeReviewModal() {
            document.getElementById('review-modal').classList.remove('show');
            document.getElementById('review-form').reset();
            document.getElementById('image-previews').innerHTML = '';
            document.getElementById('review-id').value = '';
            document.getElementById('modal-title').textContent = 'Write a Review';
        }

        // Handle image preview and conversion
        document.getElementById('review-images-input').addEventListener('change', async (e) => {
            const previews = document.getElementById('image-previews');
            previews.innerHTML = '';
            const files = Array.from(e.target.files || []);
            for (const f of files.slice(0,6)) {
                try {
                    const data = await fileToDataURL(f);
                    const img = document.createElement('img');
                    img.src = data;
                    img.style.width = '100px';
                    img.style.height = '70px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '6px';
                    previews.appendChild(img);
                } catch(err) {
                    console.error(err);
                }
            }
        });

        // Submit review form
        document.getElementById('review-form').addEventListener('submit', async (e)=>{
            e.preventDefault();
            if (!requireLogin('post a review')) return;
            const current = getCurrentUser();
            const idVal = document.getElementById('review-id').value;
            const storeName = document.getElementById('store-name').value.trim();
            const headline = document.getElementById('headline').value.trim();
            const text = document.getElementById('review-text').value.trim();
            const pricing = parseInt(document.getElementById('score-pricing').value);
            const cs = parseInt(document.getElementById('score-cs').value);
            const after = parseInt(document.getElementById('score-after').value);

            // images
            const files = Array.from(document.getElementById('review-images-input').files || []);
            const media = [];
            for (const f of files.slice(0,6)) {
                try { media.push(await fileToDataURL(f)); } catch(e) { console.error(e); }
            }

            if (idVal) {
                // edit
                const rid = parseInt(idVal);
                updateReview(rid, { headline, text, media, builderScores: { pricing, customerService: cs, afterSales: after } });
                showNotification('Review updated', 'Updated', 'success');
            } else {
                addReview({ storeName, headline, text, media, builderScores: { pricing, customerService: cs, afterSales: after }, userId: current.id, username: current.username });
                showNotification('Review posted', 'Success', 'success');
            }

            closeReviewModal();
            renderReviews();
        });

        // Open edit modal
        function openEditModal(reviewId) {
            const reviews = getAllReviews();
            const r = reviews.find(x => x.id === reviewId);
            if (!r) return;
            if (!getCurrentUser() || getCurrentUser().id !== r.userId) { showNotification('Not authorized', 'Error', 'error'); return; }
            document.getElementById('review-id').value = r.id;
            document.getElementById('store-name').value = r.storeName || '';
            document.getElementById('headline').value = r.headline || '';
            document.getElementById('review-text').value = r.text || '';
            document.getElementById('score-pricing').value = (r.builderScores && r.builderScores.pricing) || 5;
            document.getElementById('score-cs').value = (r.builderScores && r.builderScores.customerService) || 5;
            document.getElementById('score-after').value = (r.builderScores && r.builderScores.afterSales) || 5;
            const previews = document.getElementById('image-previews');
            previews.innerHTML = '';
            (r.media || []).forEach(m => { const img = document.createElement('img'); img.src = m; img.style.width='100px'; img.style.height='70px'; img.style.objectFit='cover'; img.style.borderRadius='6px'; previews.appendChild(img); });
            document.getElementById('modal-title').textContent = 'Edit Review';
            openReviewModal();
        }

        // Wire controls
        document.getElementById('create-review-btn').addEventListener('click', ()=>{
            if (!requireLogin('write a review')) return;
            openReviewModal();
        });
        sortSelect.addEventListener('change', renderReviews);
        warrantyWatch.addEventListener('change', renderReviews);

        // Close modal function exported for use in inline cancel button
        window.closeReviewModal = closeReviewModal;

        // Initial render
        renderReviews();

        // If URL includes ?edit=ID, open edit modal
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('edit')) {
            const rid = parseInt(urlParams.get('edit'));
            if (!isNaN(rid)) openEditModal(rid);
        }
    </script>
</body>
</html>
