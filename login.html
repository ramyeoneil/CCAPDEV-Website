<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-A-Muna | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo.png" alt="Tech-A-Muna Logo" class="logo-image">
            </div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
            </div>
            <div class="header-actions">
                <button class="header-btn">MAP</button>
                <button class="header-btn">FAVS</button>
                <button class="header-btn signup" onclick="window.location.href='signup-user.html'">SIGNUP</button>
            </div>
        </div>
    </header>
    <nav class="nav">
        <a href="index1.html" class="nav-link">HOME</a>
        <a href="discover.html" class="nav-link">DISCOVER</a>
        <a href="reviewtab.html" class="nav-link">REVIEWS</a>
        <a href="community.html" class="nav-link">COMMUNITY</a>
        <a href="#" class="nav-link">HELP</a>
    </nav>
    <main class="auth-page">
        <div class="auth-card">
            <h2 class="auth-title">LOG IN</h2>
            <form class="auth-form" id="login-form">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
                <button type="submit" class="auth-btn">ENTER</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-family: var(--font-mono); font-size: 0.9rem;">
                Don't have an account? <a href="signup-user.html" style="color: var(--primary-green); font-weight: 600;">Sign up</a>
            </p>
            <p style="text-align: center; margin-top: 0.5rem; font-family: var(--font-mono); font-size: 0.85rem; color: #666;">
                Test accounts:<br>
                Admin: admin@techamuna.com / admin123<br>
                User: user@email.com / user123<br>
                Store: pcshub@email.com / store123
            </p>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <a href="#" class="footer-link">About</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Contact</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Privacy</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Terms</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Social Links</a>
        </div>
    </footer>
    <script src="app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            const result = loginUser(email, password);
            
            if (result.success) {
                showNotification('Login successful! Redirecting...', 'Welcome Back', 'success');
                
                // Redirect based on user type after a short delay
                setTimeout(() => {
                    if (result.user.type === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (result.user.type === 'store') {
                        window.location.href = 'store-dashboard.html';
                    } else {
                        window.location.href = 'index1.html';
                    }
                }, 1500);
            } else {
                showNotification(result.message, 'Login Failed', 'error');
            }
        });
    </script>
</body>
</html>
