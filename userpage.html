<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile - Tech-A-Muna</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
    <div class="header-content">

        <div class="logo-container">
            <img src="logo-white.svg" class="logo-image">
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
        </div>

        <div class="header-actions">
            <button id="homeBtn" class="header-btn">HOME</button>
        </div>

    </div>
</header>

<main class="dashboard-container">

    <!-- LEFT PANEL -->
    <div class="profile-sidebar">
        <img id="profileImage" src="https://via.placeholder.com/150">
        <h3 id="displayName">John Doe</h3>
        <p id="displayBio">PC enthusiast and reviewer.</p>
        <p id="displayIdentity">Novice</p>

        <button id="editBtn" class="edit-btn">Edit Profile</button>

        <div class="edit-form" id="editForm">
            <input type="text" id="editName" placeholder="Name">
            <textarea id="editBio" rows="3" placeholder="Bio"></textarea>
            <input type="file" id="imageUpload" accept="image/*">
            <button class="save-btn" id="saveBtn">Save</button>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="review-content">
        <h2>Your Review History</h2>
        <div class="review-grid" id="reviewGrid">

        </div>
    </div>

</main>

<footer class="custom-footer">
        <div class="footer-container">

            <div class="footer-left">
            <div class="footer-logo">
                <img src="logo-green.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>

            <a href="contact-page.html" class="footer-btn">CONTACT US</a>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-right">
            <ul>
                <li><a href="about-page.html">ABOUT</a></li>
                <li><a href="privacy-page.html">PRIVACY</a></li>
                <li><a href="terms-page.html">TERMS</a></li>
                <li><a href="social-links.html">SOCIAL LINKS</a></li>
            </ul>
            </div>

        </div>
        <div class="footer-copy">© 2026 Group RAMBUTAN. All rights reserved.</div>

</footer>


    <script src="js/app.js"></script>
    <script src="js/userpage.js"></script>

</body>
</html>
