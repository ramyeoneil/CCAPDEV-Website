<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect With Us - Tech-A-Muna</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* SOCIAL LINKS PAGE STYLE */

        .social-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 60px 40px;
            background-color: #e6f4ed;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .social-container h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            color: #00703c;
            margin-bottom: 15px;
        }

        .social-container p {
            font-family: 'IBM Plex Mono', monospace;
            color: #333;
            margin-bottom: 40px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .social-btn {
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            padding: 14px 30px;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 1rem;
            background-color: #00703c;
            color: white;
            box-shadow: 0 6px 15px rgba(0, 112, 60, 0.3);
        }

        .social-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 112, 60, 0.4);
            background-color: #005c31;
        }

        @media (max-width: 600px) {
            .social-links {
                flex-direction: column;
            }

            .social-btn {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<header class="header">
    <div class="header-content">

        <div class="logo-container">
            <img src="logo-white.svg" class="logo-image">
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
        </div>

        <div class="header-actions">
            <button class="header-btn" data-href="index.html">HOME</button>
        </div>

    </div>
</header>

<script src="js/app.js"></script>
<script>
    updateHeader();
</script>

<main>
    <div class="social-container">

        <h1>Connect With Tech-A-Muna</h1>
        <p>
            Stay updated with the latest PC store reviews, tech tips, and community highlights.
            Follow us on our social platforms.
        </p>

        <div class="social-links">
            <a href="https://facebook.com" target="_blank" class="social-btn">
                Facebook
            </a>

            <a href="https://instagram.com" target="_blank" class="social-btn">
                Instagram
            </a>

            <a href="https://x.com" target="_blank" class="social-btn">
                X (Twitter)
            </a>
        </div>

    </div>
</main>
<footer class="custom-footer">
        <div class="footer-container">

            <div class="footer-left">
            <div class="footer-logo">
                <img src="logo-green.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>

            <a href="contact-page.html" class="footer-btn">CONTACT US</a>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-right">
            <ul>
                <li><a href="about-page.html">ABOUT</a></li>
                <li><a href="privacy-page.html">PRIVACY</a></li>
                <li><a href="terms-page.html">TERMS</a></li>
                <li><a href="social-links.html">SOCIAL LINKS</a></li>
            </ul>
            </div>

        </div>
        <div class="footer-copy">© 2026 Group RAMBUTAN. All rights reserved.</div>
</footer>
</body>
</html>
