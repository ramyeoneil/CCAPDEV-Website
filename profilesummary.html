<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Dashboard - Tech-A-Muna</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="dashboard-wrapper">

            <aside class="sidebar">
                <div class="sidebar-logo">
                    <img src="logo-white.svg" alt="Logo">
                    <h2>TAM<br><span>Dashboard</span></h2>
                </div>
                <nav class="sidebar-nav">
                    <a href="profilesummary.html" class="sidebar-link active">Profile Summary</a>
                    <a href="reviewactivity.html" class="sidebar-link">Review Activity</a>
                    <a href="#" class="sidebar-link">&lt;More Tabs&gt;</a>
                </nav>
            </aside>
            <main class="dashboard-content">
                <div class="profile-card">
                    <div class="profile-avatar">
                        <img src="https://via.placeholder.com/100" alt="User">
                    </div>
                    <div class="profile-info">
                        <h2>Firstname Lastname</h2>
                        <p>Joined: January 26, 2026</p>
                    </div>
                    <button class="edit-btn">EDIT</button>
                </div>
                <div class="stats-container">
                    <div class="stat-card">
                        <h3>Badges</h3>
                        <p class="stat-number">6</p>
                    </div>

                    <div class="stat-card">
                        <h3>Total Reviews Written</h3>
                        <p class="stat-number">123</p>
                    </div>

                    <div class="stat-card">
                        <h3>Helpful Votes Received</h3>
                        <p class="stat-number">123</p>
                    </div>
                </div>
            </main>
        </div>
        <footer class="custom-footer">
            <div class="footer-container">

                <div class="footer-left">
                <div class="footer-logo">
                    <img src="logo-green.svg" alt="Tech-A-Muna Logo" class="logo-image">
                </div>

                <a href="contact-page.html" class="footer-btn">CONTACT US</a>
                </div>

                <div class="footer-divider"></div>

                <div class="footer-right">
                <ul>
                    <li><a href="about-page.html">ABOUT</a></li>
                    <li><a href="privacy-page.html">PRIVACY</a></li>
                    <li><a href="terms-page.html">TERMS</a></li>
                    <li><a href="social-links.html">SOCIAL LINKS</a></li>
                </ul>
                </div>
            </div>
            <div class="footer-copy">© 2026 Group RAMBUTAN. All rights reserved.</div>
        </footer>
    </body>
</html>
