<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Details | Tech-A-Muna</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .review-detail-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 3rem;
        }

        .back-button {
            background: var(--light-gray);
            color: var(--black);
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .review-detail-card {
            background: var(--white);
            border: 3px solid var(--primary-green);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0, 112, 60, 0.15);
        }

        .review-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--light-gray);
        }

        .review-user-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .review-user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--primary-green);
        }

        .review-user-details h3 {
            font-size: 1.5rem;
            color: var(--black);
            margin-bottom: 0.5rem;
        }

        .review-date {
            font-family: var(--font-mono);
            color: #666;
            font-size: 0.9rem;
        }

        .review-rating-large {
            text-align: right;
        }

        .review-stars-large {
            font-size: 2.5rem;
            color: var(--primary-green);
            letter-spacing: 5px;
            margin-bottom: 0.5rem;
        }

        .review-rating-text {
            font-family: var(--font-mono);
            color: #666;
            font-size: 0.9rem;
        }

        .store-badge {
            background: var(--primary-green);
            color: var(--white);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .review-title {
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .review-full-text {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            line-height: 2;
            color: #333;
            margin-bottom: 2rem;
        }

        .review-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .review-images img {
            width: 100%;
            border-radius: 12px;
            border: 2px solid var(--light-gray);
        }

        .review-actions {
            display: flex;
            gap: 1rem;
            padding-top: 2rem;
            border-top: 2px solid var(--light-gray);
        }

        .action-button {
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--primary-green);
            background: transparent;
            color: var(--primary-green);
            border-radius: 8px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .action-button.primary {
            background: var(--primary-green);
            color: var(--white);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo-white.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="window.location.href='map.html'">MAP</button>
                <button class="header-btn" onclick="window.location.href='favorites.html'">FAVS</button>
                <button class="header-btn signup" onclick="window.location.href='signup-user.html'">SIGNUP</button>
            </div>
        </div>
    </header>

    <nav class="nav">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="discover.html" class="nav-link">DISCOVER</a>
        <a href="reviewtab.html" class="nav-link active">REVIEWS</a>
        <a href="community.html" class="nav-link">COMMUNITY</a>
        <a href="#" class="nav-link">HELP</a>
    </nav>

    <div class="review-detail-container">
        <button class="back-button" onclick="window.history.back()">← BACK TO REVIEWS</button>

        <div class="review-detail-card">
            <div class="review-detail-header">
                <div class="review-user-info">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png?20170328184010" 
                         alt="User Avatar" class="review-user-avatar">
                    <div class="review-user-details">
                        <h3 id="reviewer-name">Loading...</h3>
                        <div class="review-date" id="review-date">Loading...</div>
                    </div>
                </div>
                <div class="review-rating-large">
                    <div class="review-stars-large" id="review-stars">★★★★★</div>
                    <div class="review-rating-text" id="rating-text">5.0 out of 5</div>
                </div>
            </div>

            <div class="store-badge" id="store-name">PC Hub Manila</div>

            <h1 class="review-title" id="review-headline">Outstanding customer service and lightning-fast shipping times</h1>

            <div class="review-full-text" id="review-full-text">
                Loading review content...
            </div>

            <div class="review-images" id="review-images">
                <!-- Images will be loaded here if available -->
            </div>

            <div class="review-actions">
                <button class="action-button primary" onclick="viewStore()">VIEW STORE</button>
                <button class="action-button" onclick="toggleReviewFavorite()">
                    <span id="fav-icon">♡</span> ADD TO FAVORITES
                </button>
            </div>
        </div>
    </div>

    <footer class="custom-footer">
        <div class="footer-container">

            <div class="footer-left">
            <div class="footer-logo">
                <img src="logo-green.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>

            <a href="contact-page.html" class="footer-btn">CONTACT US</a>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-right">
            <ul>
                <li><a href="about-page.html">ABOUT</a></li>
                <li><a href="privacy-page.html">PRIVACY</a></li>
                <li><a href="terms-page.html">TERMS</a></li>
                <li><a href="social-links.html">SOCIAL LINKS</a></li>
            </ul>
            </div>

        </div>
        <div class="footer-copy">© 2026 Group RAMBUTAN. All rights reserved.</div>
    </footer>

    <script src="app.js"></script>
    <script>
        // Update header based on login status
        updateHeader();
        makeLogoClickable();

        // Get review ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const reviewId = parseInt(urlParams.get('id'));

        // Load review data and render
        function loadReview() {
            const reviews = getAllReviews();
            const review = reviews.find(r => r.id === reviewId);

            if (!review) {
                showNotification('Review not found', 'Error', 'error');
                setTimeout(() => window.location.href = 'reviewtab.html', 1500);
                return;
            }

            document.getElementById('reviewer-name').textContent = review.username;
            document.getElementById('review-date').textContent = review.date;

            // Build stars from computed rating
            const rating = review.rating || Math.round(((review.builderScores && (review.builderScores.pricing + review.builderScores.customerService + review.builderScores.afterSales)/3) || 5));
            document.getElementById('review-stars').textContent = '★'.repeat(rating) + '☆'.repeat(5 - rating);
            document.getElementById('rating-text').textContent = `${rating}.0 out of 5`;

            document.getElementById('store-name').textContent = review.storeName || 'PC Hub Manila';
            document.getElementById('review-headline').textContent = review.headline || '';
            document.getElementById('review-full-text').textContent = review.text || '';

            // Show images
            const imagesContainer = document.getElementById('review-images');
            imagesContainer.innerHTML = '';
            (review.media || []).forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                imagesContainer.appendChild(img);
            });

            // Show builder scores
            const scoreText = `Pricing: ${(review.builderScores && review.builderScores.pricing) || '-'} • Customer Service: ${(review.builderScores && review.builderScores.customerService) || '-'} • After-Sales/Warranty: ${(review.builderScores && review.builderScores.afterSales) || '-'} `;
            const existing = document.getElementById('rating-text');
            existing.textContent = existing.textContent + ' · ' + scoreText;

            // Add upvote and comment UI
            renderActions(review);
        }

        function renderActions(review) {
            // Add upvote / comment buttons to actions area
            const actions = document.querySelector('.review-actions');
            actions.innerHTML = '';

            const upvoteBtn = document.createElement('button');
            upvoteBtn.className = 'action-button primary';
            upvoteBtn.textContent = `▲ Helpful (${review.upvotes || 0})`;
            upvoteBtn.addEventListener('click', ()=>{
                if (!requireLogin('upvote this review')) return;
                const uid = getCurrentUser().id;
                upvoteReview(review.id, uid);
                loadReview();
            });

            const commentBtn = document.createElement('button');
            commentBtn.className = 'action-button';
            commentBtn.textContent = `💬 Comment (${(review.comments||[]).length})`;
            commentBtn.addEventListener('click', ()=>{
                if (!requireLogin('comment on this review')) return;
                const text = prompt('Enter your comment');
                if (text && text.trim()) {
                    const current = getCurrentUser();
                    addCommentToReview(review.id, { userId: current.id, username: current.username, text: text.trim() });
                    showNotification('Comment added', 'Success', 'success');
                    loadReview();
                }
            });

            actions.appendChild(upvoteBtn);
            actions.appendChild(commentBtn);

            // If owner, show edit/delete
            const current = getCurrentUser();
            if (current && current.id === review.userId) {
                const editBtn = document.createElement('button');
                editBtn.className = 'action-button';
                editBtn.textContent = 'Edit';
                editBtn.addEventListener('click', ()=>{
                    // Open edit flow by redirecting to reviewtab edit modal
                    window.location.href = `reviewtab.html?edit=${review.id}`;
                });

                const delBtn = document.createElement('button');
                delBtn.className = 'action-button';
                delBtn.textContent = 'Delete';
                delBtn.addEventListener('click', async ()=>{
                    const confirmed = await showConfirmation('Delete this review?', 'Confirm Delete');
                    if (confirmed) {
                        deleteReview(review.id);
                        showNotification('Review deleted', 'Deleted', 'warning');
                        setTimeout(()=>window.location.href='reviewtab.html',800);
                    }
                });

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
            }

            // Render comments below actions
            renderComments(review);
        }

        function renderComments(review) {
            // remove existing comments section if any
            let commentsSection = document.getElementById('comments-section');
            if (commentsSection) commentsSection.remove();

            commentsSection = document.createElement('div');
            commentsSection.id = 'comments-section';
            commentsSection.style.marginTop = '1.5rem';
            commentsSection.innerHTML = '<h3>Comments</h3>';
            (review.comments || []).forEach(c => {
                const cEl = document.createElement('div');
                cEl.style.borderTop = '1px solid #eee';
                cEl.style.padding = '0.75rem 0';
                cEl.innerHTML = `<strong>${c.username}</strong> <span style="color:#666;font-family:var(--font-mono);">• ${c.date}</span><div style="margin-top:6px;">${c.text}</div>`;
                commentsSection.appendChild(cEl);
            });

            document.querySelector('.review-detail-card').appendChild(commentsSection);
        }

        // Load review on page load
        loadReview();
    </script>
</body>
</html>
