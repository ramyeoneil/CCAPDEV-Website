<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-A-Muna | Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo.png" alt="Tech-A-Muna Logo" class="logo-image">
            </div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
            </div>
            <div class="header-actions">
                <button class="header-btn">MAP</button>
                <button class="header-btn">FAVS</button>
                <button class="header-btn signup" onclick="window.location.href='login.html'">LOGIN</button>
            </div>
        </div>
    </header>
    <nav class="nav">
        <a href="index1.html" class="nav-link">HOME</a>
        <a href="discover.html" class="nav-link">DISCOVER</a>
        <a href="reviewtab.html" class="nav-link">REVIEWS</a>
        <a href="community.html" class="nav-link">COMMUNITY</a>
        <a href="#" class="nav-link">HELP</a>
    </nav>
    <main class="auth-page">
        <div class="auth-card wide">
            <h2 class="auth-title">SIGN UP AS USER</h2>
            <form class="auth-grid" id="user-signup-form">
                <div>
                    <label>Email</label>
                    <input type="email" id="email" required>
                    <label>Username</label>
                    <input type="text" id="username" required>
                    <label>Password</label>
                    <input type="password" id="password" required>
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <div>
                    <label>Address</label>
                    <input type="text" id="address" required>
                    <label>City</label>
                    <input type="text" id="city" required>
                    <label>Province</label>
                    <input type="text" id="province" required>
                    <label>Postal Code</label>
                    <input type="text" id="postal" required>
                </div>
            </form>
            <button class="auth-btn" onclick="submitUserSignup()">ENTER</button>
            <p style="text-align: center; margin-top: 1.5rem; font-family: var(--font-mono); font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color: var(--primary-green); font-weight: 600;">Log in</a>
            </p>
            <p style="text-align: center; margin-top: 0.5rem; font-family: var(--font-mono); font-size: 0.9rem;">
                Want to register as a store? <a href="signup-store.html" style="color: var(--primary-green); font-weight: 600;">Store Signup</a>
            </p>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <a href="about-page.html" class="footer-link">About</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Contact</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Privacy</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Terms</a>
            <span class="footer-separator">|</span>
            <a href="#" class="footer-link">Social Links</a>
        </div>
    </footer>
    <script src="app.js"></script>
    <script>
        function submitUserSignup() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            const userData = {
                type: 'user',
                email: document.getElementById('email').value,
                username: document.getElementById('username').value,
                password: password,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                province: document.getElementById('province').value,
                postalCode: document.getElementById('postal').value
            };
            
            const result = registerUser(userData);
            
            if (result.success) {
                alert('Account created successfully! Please log in.');
                window.location.href = 'login.html';
            } else {
                alert(result.message);
            }
        }
    </script>
</body>
</html>
