<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-A-Muna | Discover</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/discover.css">
    
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo-white.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
            </div>
                <div class="header-actions">
                <button class="header-btn" data-href="map.html">MAP</button>
                <button class="header-btn">FAVS</button>
                <button class="header-btn signup">SIGNUP</button>
            </div>
        </div>
    </header>

    <nav class="nav">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="discover.html" class="nav-link active">DISCOVER</a>
        <a href="reviewtab.html" class="nav-link">REVIEWS</a>
        <a href="community.html" class="nav-link">COMMUNITY</a>
    </nav>
    <main class="discover-page">
        <div class="container">
            <h2 class="section-title">DISCOVER</h2>
            <div class="discover-filters">
                <button class="filter-tag active" data-action="filterByLocation" data-arg="all" data-location="all">All</button>
                <button class="filter-tag" data-action="filterByLocation" data-arg="Makati City" data-location="Makati City">Makati City</button>
                <button class="filter-tag" data-action="filterByLocation" data-arg="Quezon City" data-location="Quezon City">Quezon City</button>
                <button class="filter-tag" data-action="filterByLocation" data-arg="Pasay" data-location="Pasay">Pasay</button>
            </div>

            <div id="discover-grid" class="discover-grid"></div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/discover.js"></script>
</body>
</html>
