<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-A-Muna | Community</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .community-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 2rem;
            min-height: calc(100vh - 400px);
        }

        .create-post-section {
            background: var(--white);
            border: 3px solid var(--primary-green);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .create-post-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary-green);
            margin-bottom: 1.5rem;
        }

        .create-post-btn {
            width: 100%;
            padding: 1rem;
            background: var(--light-gray);
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: #666;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .create-post-btn:hover {
            border-color: var(--primary-green);
            background: #f8f9fa;
        }

        .community-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--light-gray);
        }

        .community-filter-btn {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .community-filter-btn.active {
            color: var(--primary-green);
            border-bottom-color: var(--primary-green);
        }

        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .post-card {
            background: var(--white);
            border: 2px solid var(--light-gray);
            border-radius: 14px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .post-card:hover {
            box-shadow: 0 8px 25px rgba(0, 112, 60, 0.15);
            border-color: var(--primary-green);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .post-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-green);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .post-user-info {
            flex: 1;
        }

        .post-username {
            font-weight: 700;
            font-size: 1rem;
            color: var(--black);
            letter-spacing: 0.5px;
        }

        .post-date {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #666;
        }

        .post-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-green);
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .post-content {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.8;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .post-image {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .post-actions {
            display: flex;
            gap: 2rem;
            border-top: 1px solid var(--light-gray);
            padding-top: 1.2rem;
        }

        .post-action-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .post-action-btn:hover {
            color: var(--primary-green);
        }

        .post-action-btn.liked {
            color: var(--primary-green);
        }

        .action-icon {
            font-size: 1.2rem;
        }

        .no-posts {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
            font-family: var(--font-mono);
        }

        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10000; align-items:center; justify-content:center; }
        .modal.show { display:flex; }
        .modal-content { background:#fff; width:min(560px,92vw); border-radius:12px; padding:1.2rem 1.4rem; }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
        .close-btn { border:none; background:none; font-size:1.8rem; cursor:pointer; }
        .form-group { margin-bottom:0.8rem; }
        .form-group label { display:block; margin-bottom:.35rem; color:var(--primary-green); font-size:.8rem; font-weight:600; letter-spacing:1px; }
        .form-group input, .form-group textarea { width:100%; padding:.65rem .7rem; border:2px solid var(--light-gray); border-radius:8px; font-family:var(--font-mono); }
        .form-group textarea { min-height:110px; resize:vertical; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo-white.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
            </div>
            <div class="header-actions">
                <button class="header-btn" data-href="map.html">MAP</button>
                <button class="header-btn">FAVS</button>
                <button class="header-btn signup">SIGNUP</button>
            </div>
        </div>
    </header>

    <nav class="nav">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="discover.html" class="nav-link">DISCOVER</a>
        <a href="reviewtab.html" class="nav-link">REVIEWS</a>
        <a href="community.html" class="nav-link active">COMMUNITY</a>
    </nav>

    <main class="community-page">
        <h2 class="section-title">COMMUNITY</h2>

        <div class="create-post-section">
            <div class="create-post-title">SHARE WITH THE COMMUNITY</div>
            <button class="create-post-btn" data-action="createPost">
                What's on your mind? Share your build, ask questions, or discuss tech...
            </button>
        </div>

        <div class="community-filters">
            <button class="community-filter-btn active" data-action="filterPosts" data-arg="all">TRENDING</button>
            <button class="community-filter-btn" data-action="filterPosts" data-arg="builds">BUILDS</button>
            <button class="community-filter-btn" data-action="filterPosts" data-arg="questions">QUESTIONS</button>
            <button class="community-filter-btn" data-action="filterPosts" data-arg="discussions">DISCUSSIONS</button>
        </div>

        <div class="posts-container" id="posts-container">
            <!-- Will be populated by JavaScript -->
        </div>
    </main>
    <div id="community-post-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>CREATE POST</h2>
                <button class="close-btn" id="close-post-modal">&times;</button>
            </div>
            <form id="community-post-form">
                <div class="form-group">
                    <label>Title (optional)</label>
                    <input type="text" id="community-post-title">
                </div>
                <div class="form-group">
                    <label>What's on your mind?</label>
                    <textarea id="community-post-content" required></textarea>
                </div>
                <button type="submit" class="auth-btn">POST</button>
            </form>
        </div>
    </div>

    <div id="community-comment-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>ADD COMMENT</h2>
                <button class="close-btn" id="close-community-comment-modal">&times;</button>
            </div>
            <form id="community-comment-form">
                <div class="form-group">
                    <label for="community-comment-text">Comment</label>
                    <textarea id="community-comment-text" required></textarea>
                </div>
                <button type="submit" class="auth-btn">POST COMMENT</button>
            </form>
        </div>
    </div>

    <footer class="custom-footer">
        <div class="footer-container">

            <div class="footer-left">
            <div class="footer-logo">
                <img src="logo-green.svg" alt="Tech-A-Muna Logo" class="logo-image">
            </div>

            <a href="contact-page.html" class="footer-btn">CONTACT US</a>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-right">
            <ul>
                <li><a href="about-page.html">ABOUT</a></li>
                <li><a href="privacy-page.html">PRIVACY</a></li>
                <li><a href="terms-page.html">TERMS</a></li>
                <li><a href="social-links.html">SOCIAL LINKS</a></li>
            </ul>
            </div>

        </div>
        <div class="footer-copy">© 2026 Group RAMBUTAN. All rights reserved.</div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/community.js"></script>
</body>
</html>
