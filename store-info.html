<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tech-A-Muna | Reviews</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <div class="header-content">
                <div class="logo-container">
                    <img src="logo.png" alt="Tech-A-Muna Logo" class="logo-image">
                </div>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="SEARCH FOR PC STORES / PRODUCTS">
                </div>
                <div class="header-actions">
                    <button class="header-btn">MAP</button>
                    <button class="header-btn">FAVS</button>
                    <button class="header-btn signup">SIGNUP</button>
                </div>
            </div>
        </header>
        <nav class="nav">
            <a href="index1.html" class="nav-link">HOME</a>
            <a href="#" class="nav-link">DISCOVER</a>
            <a href="reviewtab.html" class="nav-link active">REVIEWS</a>
            <a href="#" class="nav-link">COMMUNITY</a>
            <a href="#" class="nav-link">HELP</a>
        </nav>
        <main class="auth-page">
            <div class="auth-card wide">
                <h2 class="auth-title">STORE INFORMATION</h2>
                <h3 class="form-section-title">Store & Contact Details</h3>
                <form class="auth-grid">
                    <div>
                        <label>Store Name</label>
                        <input type="text">
                        <label>Store Email</label>
                        <input type="email">
                        <label>Phone Number</label>
                        <input type="text">
                    </div>
                    <div>
                        <label>Online Shop Link</label>
                        <input type="url">
                    </div>
                </form>
                <h3 class="form-section-title">Store Address</h3>
                <form class="auth-grid">
                    <div>
                        <label>Region</label>
                        <input type="text">
                        <label>Province</label>
                        <input type="text">
                    </div>
                    <div>
                        <label>City</label>
                        <input type="text">
                        <label>Complete Address</label>
                        <input type="text">
                    </div>
                </form>
                <h3 class="form-section-title">Operating Hours</h3>
                <form class="auth-grid">
                    <div>
                        <label>Opening Time</label>
                        <input type="time">
                        <label>Closing Time</label>
                        <input type="time">
                    </div>
                    <div class="operating-days">
                        <label>
                            <input type="checkbox"> Monday
                        </label>
                        <label>
                            <input type="checkbox"> Tuesday
                        </label>
                        <label>
                            <input type="checkbox"> Wednesday
                        </label>
                        <label>
                            <input type="checkbox"> Thursday
                        </label>
                        <label>
                            <input type="checkbox"> Friday
                        </label>
                        <label>
                            <input type="checkbox"> Saturday
                        </label>
                        <label>
                            <input type="checkbox"> Sunday
                        </label>
                    </div>
                </form>
                <button class="auth-btn">SUBMIT</button>
            </div>
        </main>
        <footer class="footer">
            <div class="footer-content">
                <a href="#" class="footer-link">About</a>
                <span class="footer-separator">|</span>
                <a href="#" class="footer-link">Contact</a>
                <span class="footer-separator">|</span>
                <a href="#" class="footer-link">Privacy</a>
                <span class="footer-separator">|</span>
                <a href="#" class="footer-link">Terms</a>
                <span class="footer-separator">|</span>
                <a href="#" class="footer-link">Social Links</a>
            </div>
        </footer>
    </body>
</html>
